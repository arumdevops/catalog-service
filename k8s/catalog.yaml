apiVersion: apps/v1
kind: Deployment
metadata: {name: mongo-catalog, namespace: lms}
spec:
  replicas: 1
  selector: {matchLabels: {app: mongo-catalog}}
  template:
    metadata: {labels: {app: mongo-catalog}}
    spec:
      containers:
      - name: mongo
        image: mongo:6
        ports: [{containerPort: 27017}]
---
apiVersion: v1
kind: Service
metadata: {name: mongo-catalog, namespace: lms}
spec:
  selector: {app: mongo-catalog}
  ports: [{port: 27017}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-service, namespace: lms}
spec:
  replicas: 1
  selector: {matchLabels: {app: catalog-service}}
  template:
    metadata: {labels: {app: catalog-service}}
    spec:
      containers:
      - name: catalog
        image: catalog-service:1.0
        imagePullPolicy: Never
        ports: [{containerPort: 5000}]
        env:
        - {name: MONGO_URL, value: "mongodb://mongo-catalog:27017"}
---
apiVersion: v1
kind: Service
metadata: {name: catalog-service, namespace: lms}
spec:
  selector: {app: catalog-service}
  ports: [{port: 5000, targetPort: 5000}]
